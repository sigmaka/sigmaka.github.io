<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ts.skrauss.ch</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <style>
      .logo-band {
        height: 8rem;
        background-color: #fff;
        padding: 1rem;
      }
      .logo-band img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }
      .course-card {
        transition:
          transform 0.15s ease-in-out,
          box-shadow 0.15s ease-in-out;
      }
      .course-card:hover,
      .course-card:focus-within {
        transform: translateY(-0.25rem);
        box-shadow: var(--bs-box-shadow) !important;
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex flex-column justify-content-center py-5">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 justify-content-center">
        <div class="col">
          <div class="card course-card h-100 shadow-sm">
            <div class="logo-band d-flex align-items-center justify-content-center">
              <img
                src="logo_SYS_RE1.svg"
                alt="Logo Regelungstechnik 1"
                class="img-fluid"
              />
            </div>
            <div class="card-body d-flex flex-column text-center">
              <h2 class="card-title h5">Regelungstechnik 1</h2>
              <p class="card-subtitle text-body-secondary mb-4">
                <span class="badge text-bg-secondary">SYS_RE1</span>
              </p>
              <div class="mt-auto d-grid">
                <a href="/SYS_RE1/" class="btn btn-primary">Zum Modul</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card course-card h-100 shadow-sm">
            <div class="logo-band d-flex align-items-center justify-content-center">
              <img
                src="logo_SYS_RE2.svg"
                alt="Logo Regelungstechnik 2"
                class="img-fluid"
              />
            </div>
            <div class="card-body d-flex flex-column text-center">
              <h2 class="card-title h5">Regelungstechnik 2</h2>
              <p class="card-subtitle text-body-secondary mb-4">
                <span class="badge text-bg-secondary">SYS_RE2</span>
              </p>
              <div class="mt-auto d-grid">
                <a href="/SYS_RE2/" class="btn btn-primary">Zum Modul</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card course-card h-100 shadow-sm">
            <div class="logo-band d-flex align-items-center justify-content-center">
              <img
                src="logo_MAT_AGW.svg"
                alt="Logo Angewandte Mathematik"
                class="img-fluid"
              />
            </div>
            <div class="card-body d-flex flex-column text-center">
              <h2 class="card-title h5">Angewandte Mathematik</h2>
              <p class="card-subtitle text-body-secondary mb-4">
                <span class="badge text-bg-secondary">MAT_AGW</span>
              </p>
              <div class="mt-auto d-grid">
                <a href="/MAT_AGW/" class="btn btn-primary">Zum Modul</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
